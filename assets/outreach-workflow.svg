<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Autonomous Outreach System workflow</title>
  <desc id="desc">Four-step workflow from discovery to analytics.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10213a"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#55e6a5"/><stop offset="1" stop-color="#55c7ff"/></linearGradient></defs>
  <rect width="1600" height="560" rx="28" fill="url(#bg)"/><text x="92" y="84" fill="#f8fbff" font-family="Inter,Arial" font-size="30" font-weight="700">From signal to conversation</text><text x="92" y="118" fill="#8497b4" font-family="Inter,Arial" font-size="16">A reviewable workflow for discovering, personalizing and measuring outreach.</text>
  <line x1="270" y1="276" x2="1330" y2="276" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/><g font-family="Inter,Arial">
    <g transform="translate(100 172)"><circle cx="80" cy="104" r="70" fill="#102b3a" stroke="#55e6a5" stroke-width="3"/><text x="62" y="116" fill="#55e6a5" font-size="34" font-weight="700">01</text><text x="0" y="230" fill="#f8fbff" font-size="21" font-weight="700">Discover</text><text x="0" y="260" fill="#8497b4" font-size="14">Find relevant companies</text><text x="0" y="282" fill="#8497b4" font-size="14">across configured sources.</text></g>
    <g transform="translate(490 172)"><circle cx="80" cy="104" r="70" fill="#102b3a" stroke="#55c7ff" stroke-width="3"/><text x="62" y="116" fill="#55c7ff" font-size="34" font-weight="700">02</text><text x="0" y="230" fill="#f8fbff" font-size="21" font-weight="700">Enrich &amp; verify</text><text x="0" y="260" fill="#8497b4" font-size="14">Validate contacts and rank</text><text x="0" y="282" fill="#8497b4" font-size="14">the best next opportunities.</text></g>
    <g transform="translate(880 172)"><circle cx="80" cy="104" r="70" fill="#102b3a" stroke="#55e6a5" stroke-width="3"/><text x="62" y="116" fill="#55e6a5" font-size="34" font-weight="700">03</text><text x="0" y="230" fill="#f8fbff" font-size="21" font-weight="700">Personalize &amp; review</text><text x="0" y="260" fill="#8497b4" font-size="14">Generate useful context,</text><text x="0" y="282" fill="#8497b4" font-size="14">then approve before sending.</text></g>
    <g transform="translate(1270 172)"><circle cx="80" cy="104" r="70" fill="#102b3a" stroke="#55c7ff" stroke-width="3"/><text x="62" y="116" fill="#55c7ff" font-size="34" font-weight="700">04</text><text x="0" y="230" fill="#f8fbff" font-size="21" font-weight="700">Launch &amp; learn</text><text x="0" y="260" fill="#8497b4" font-size="14">Run campaigns in dry-run</text><text x="0" y="282" fill="#8497b4" font-size="14">or live mode, then measure.</text></g>
  </g><text x="92" y="494" fill="#55e6a5" font-family="Inter,Arial" font-size="14" font-weight="700" letter-spacing="1.5">SELF-HOSTED · AI-ASSISTED · REVIEWABLE · EXTENSIBLE</text>
</svg>
