<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="150" fill="url(#accent-grad)" opacity="0.1"/>
  <circle cx="1100" cy="530" r="200" fill="url(#accent-grad)" opacity="0.1"/>
  
  <!-- Main content area -->
  <g transform="translate(60, 150)">
    <!-- Logo/icon -->
    <rect x="0" y="0" width="120" height="120" rx="20" fill="url(#accent-grad)"/>
    <rect x="30" y="40" width="60" height="40" rx="5" fill="white" opacity="0.8"/>
    <path d="M30 40 L60 70 L90 40" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="3"/>
    
    <!-- Title -->
    <text x="150" y="50" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">
      ResumeSendtoCompany
    </text>
    
    <!-- Subtitle -->
    <text x="150" y="90" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.7)">
      Autonomous Outreach System
    </text>
    
    <!-- Description -->
    <text x="0" y="180" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.8)">
      Production-grade, 24/7 autonomous outreach system for lead discovery,
    </text>
    <text x="0" y="210" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.8)">
      LinkedIn enrichment, and AI-driven personalized campaigns.
    </text>
    
    <!-- Features badges -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="140" height="35" rx="17" fill="rgba(102,126,234,0.3)" stroke="rgba(102,126,234,0.6)" stroke-width="2"/>
      <text x="70" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">AI-Powered</text>
      
      <rect x="160" y="0" width="140" height="35" rx="17" fill="rgba(118,75,162,0.3)" stroke="rgba(118,75,162,0.6)" stroke-width="2"/>
      <text x="230" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">24/7 Automation</text>
      
      <rect x="320" y="0" width="140" height="35" rx="17" fill="rgba(240,147,251,0.3)" stroke="rgba(240,147,251,0.6)" stroke-width="2"/>
      <text x="390" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">Multi-Provider</text>
      
      <rect x="480" y="0" width="140" height="35" rx="17" fill="rgba(76,175,80,0.3)" stroke="rgba(76,175,80,0.6)" stroke-width="2"/>
      <text x="550" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">Enterprise Ready</text>
    </g>
    
    <!-- Tech stack -->
    <g transform="translate(0, 320)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.6)">Built with:</text>
      
      <rect x="0" y="15" width="80" height="25" rx="5" fill="#339933"/>
      <text x="40" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Node.js</text>
      
      <rect x="90" y="15" width="60" height="25" rx="5" fill="#61DAFB"/>
      <text x="120" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="black">React</text>
      
      <rect x="160" y="15" width="50" height="25" rx="5" fill="#4285F4"/>
      <text x="185" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">SQLite</text>
      
      <rect x="220" y="15" width="70" height="25" rx="5" fill="#F05032"/>
      <text x="255" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Gemini AI</text>
      
      <rect x="300" y="15" width="40" height="25" rx="5" fill="#68A063"/>
      <text x="320" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">PM2</text>
    </g>
  </g>
  
  <!-- GitHub branding -->
  <g transform="translate(980, 560)">
    <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.5)">
      github.com/semih-kilic
    </text>
  </g>
  
  <!-- Bottom accent line -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent-grad)"/>
</svg>